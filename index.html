        owner: String(rec.owner || "Business / Finance").slice(0, 100),
        nextAction: String(rec.nextAction || "").slice(0, 1000),
        targetDate: String(rec.targetDate || "").slice(0, 20),
        rag: RAG_OPTIONS.includes(rec.rag) ? rec.rag : "Amber"
      };
    }

    function sanitizeActionPayload(act) {
      return {
        actionId: String(act.actionId || "").slice(0, 64),
        state: String(act.state || "").slice(0, 100),
        location: String(act.location || "").slice(0, 100),
        company: String(act.company || "").slice(0, 100),
        businessSegment: String(act.businessSegment || "").slice(0, 100),
        incentiveType: String(act.incentiveType || "").slice(0, 200),
        currentStatus: STATUSES.includes(act.currentStatus) ? act.currentStatus : "Under Assessment",
        priority: PRIORITIES.includes(act.priority) ? act.priority : "High",
        owner: String(act.owner || "Business / Finance").slice(0, 100),
        nextAction: String(act.nextAction || "").slice(0, 1000),
        targetDate: String(act.targetDate || "").slice(0, 20),
        rag: RAG_OPTIONS.includes(act.rag) ? act.rag : "Amber"
      };
    }

    function sanitizeAuditLogPayload(log) {
      const detailText = String(log.details || log.summary || "").slice(0, 2000);
      return {
        id: String(log.id || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 64),
        timestamp: String(log.timestamp || new Date().toISOString()).slice(0, 64),
        userEmail: String(log.userEmail || "unknown").slice(0, 256),
        action: ["Added", "Updated", "Deleted"].includes(log.action) ? log.action : "Updated",
        recordId: String(log.recordId || "").slice(0, 256),
        details: detailText,
        summary: detailText
      };
    }

    function formatAuditTimestamp(isoStr) {
      if (!isoStr) return "—";
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        });
      } catch (e) {
        return isoStr;
      }
    }

    function computeUpdateSummary(oldRec, newRec) {
      if (!oldRec) return `Updated incentive ${newRec.id}`;
      const fieldLabels = [
        ["status", "Status"],
        ["priority", "Priority"],
        ["rag", "RAG"],
        ["targetDate", "Target Date"],
        ["nextAction", "Next Action"],
        ["owner", "Owner"],
        ["policyScheme", "Policy / Scheme"],
        ["incentiveCategory", "Incentive Category"],
        ["incentiveType", "Incentive Type"],
        ["state", "State"],
        ["location", "Location"],
        ["company", "Company"],
        ["businessSegment", "Business Segment"],
        ["governmentLevel", "Government Level"],
        ["benefitSummary", "Benefit Summary"],
        ["keyEligibility", "Key Eligibility"],
        ["source", "Source"]
      ];
      const diffs = [];
      fieldLabels.forEach(([key, label]) => {
        const oldVal = String(oldRec[key] || "").trim();
        const newVal = String(newRec[key] || "").trim();
        if (oldVal !== newVal) {
          if (key === "benefitSummary" || key === "keyEligibility") {
            diffs.push(`Updated ${label}`);
          } else {
            diffs.push(`Changed ${label} from ${oldVal || "empty"} to ${newVal || "empty"}`);
          }
        }
      });
      return diffs.length > 0 ? diffs.join("; ") : "Saved record without field changes";
    }

              (item.company && item.company.toLowerCase().includes(q)) ||
              (item.businessSegment && item.businessSegment.toLowerCase().includes(q));
            if (!match) return false;
          }
          return true;
        });
      }, [incentives, stateFilter, locationFilter, companyFilter, segmentFilter, categoryFilter, statusFilter, govLevelFilter, searchQuery]);

      // Filtered Actions (Tab 2)
      const filteredActions = useMemo(() => {
        return actions.filter(act => {
          if (stateFilter !== "All" && act.state !== stateFilter) return false;
          if (locationFilter !== "All" && act.location !== locationFilter) return false;
          if (companyFilter !== "All" && act.company !== companyFilter) return false;
          if (segmentFilter !== "All" && act.businessSegment !== segmentFilter) return false;

          if (statusFilter !== "All") {
            if (statusFilter === "Approved / Claimed") {
              if (act.currentStatus !== "Approved" && act.currentStatus !== "Claimed") return false;
            } else if (act.currentStatus !== statusFilter) {
              return false;
            }
          }

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const match =
              (act.actionId && act.actionId.toLowerCase().includes(q)) ||
              (act.nextAction && act.nextAction.toLowerCase().includes(q)) ||
              (act.incentiveType && act.incentiveType.toLowerCase().includes(q)) ||
              (act.location && act.location.toLowerCase().includes(q)) ||
              (act.company && act.company.toLowerCase().includes(q)) ||
              (act.owner && act.owner.toLowerCase().includes(q));
            if (!match) return false;
          }
          return true;
        });
      }, [actions, stateFilter, locationFilter, companyFilter, segmentFilter, statusFilter, searchQuery]);

      // Sorted Incentives
      const sortedIncentives = useMemo(() => {
        if (!sortField || sortDirection === "none") return filteredIncentives;
        return [...filteredIncentives].sort((a, b) => {
          let valA = a[sortField] || "";
          let valB = b[sortField] || "";
          if (typeof valA === "string") valA = valA.toLowerCase();
          if (typeof valB === "string") valB = valB.toLowerCase();
          if (valA < valB) return sortDirection === "asc" ? -1 : 1;
          if (valA > valB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });
      }, [filteredIncentives, sortField, sortDirection]);

      // Pagination
      const totalPages = Math.max(1, Math.ceil(sortedIncentives.length / rowsPerPage));
      const effectivePage = Math.min(currentPage, totalPages);
      const paginatedIncentives = useMemo(() => {
        const start = (effectivePage - 1) * rowsPerPage;
        return sortedIncentives.slice(start, start + rowsPerPage);
      }, [sortedIncentives, effectivePage, rowsPerPage]);

      // KPIs
      const kpis = useMemo(() => {
        const total = filteredIncentives.length;
        let central = 0;
        let state = 0;
        let applicable = 0;
        let underAssessment = 0;
        let claimed = 0;
        let approved = 0;

        filteredIncentives.forEach(item => {
          if (item.governmentLevel === "Central") central++;
          if (item.governmentLevel === "State") state++;
          if (item.status === "Applicable") applicable++;
          if (item.status === "Under Assessment") underAssessment++;
          if (item.status === "Claimed") claimed++;
          if (item.status === "Approved") approved++;
        });

        return {
          total,
          central,
          state,
          applicable,
          underAssessment,
          claimed,
          approved
        };
      }, [filteredIncentives]);

      const handleKpiClick = (type) => {
        setCurrentPage(1);
        if (type === "total") {
          setGovLevelFilter("All");
          setStatusFilter("All");
        } else if (type === "central") {
          setGovLevelFilter(govLevelFilter === "Central" ? "All" : "Central");
        } else if (type === "state") {
          setGovLevelFilter(govLevelFilter === "State" ? "All" : "State");
        } else if (type === "applicable") {
          setStatusFilter(statusFilter === "Applicable" ? "All" : "Applicable");
        } else if (type === "underAssessment") {
          setStatusFilter(statusFilter === "Under Assessment" ? "All" : "Under Assessment");
        } else if (type === "claimed") {
          setStatusFilter(statusFilter === "Claimed" ? "All" : "Claimed");
        } else if (type === "approved") {
          setStatusFilter(statusFilter === "Approved" ? "All" : "Approved");
        }
      };

      const handleSort = (field) => {
        if (sortField !== field) {
          setSortField(field);
          setSortDirection("asc");
        } else if (sortDirection === "asc") {
          setSortDirection("desc");
        } else {
          setSortField(null);
          setSortDirection("none");
        }
      };

      const handleSelectAll = (e) => {
        if (e.target.checked) {
          const currentPageIds = paginatedIncentives.map(item => item.id);
          const combined = Array.from(new Set([...selectedIds, ...currentPageIds]));
          setSelectedIds(combined);
        } else {
          const currentPageIds = new Set(paginatedIncentives.map(item => item.id));
          setSelectedIds(selectedIds.filter(id => !currentPageIds.has(id)));
        }
      };

      const handleSelectRow = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const isCurrentPageAllSelected = paginatedIncentives.length > 0 && paginatedIncentives.every(item => selectedIds.includes(item.id));
      const isCurrentPageSomeSelected = paginatedIncentives.some(item => selectedIds.includes(item.id)) && !isCurrentPageAllSelected;

      // Single item delete
      const handleDeleteSingle = async (id) => {
        const target = incentives.find(item => item.id === id);
        const next = incentives.filter(item => item.id !== id);
        updateIncentivesAndPersist(next);
        setSelectedIds(prev => prev.filter(i => i !== id));
        setDeleteTargetId(null);
        if (currentUser && fbRef.current) {
          const { db, fsMod } = fbRef.current;
          try {
            await fsMod.deleteDoc(fsMod.doc(db, "incentives", id));
          } catch (err) {
            handleFirestoreError(err, OperationType.DELETE, `incentives/${id}`);
          }
        }
        const summary = target
          ? `Deleted incentive '${target.policyScheme || target.incentiveType || id}' (${target.state} — ${target.company})`
          : `Deleted incentive record ${id}`;
        await recordAuditLog("Deleted", id, summary);
        showToast(`Incentive ${id} deleted`);
      };

      // Bulk delete
      const handleBulkDelete = async () => {
        const idsToDelete = [...selectedIds];
        const next = incentives.filter(item => !idsToDelete.includes(item.id));
        const count = idsToDelete.length;
        updateIncentivesAndPersist(next);
        setSelectedIds([]);
        setShowBulkDeleteConfirm(false);
        if (currentUser && fbRef.current) {
          const { db, fsMod } = fbRef.current;
          try {
            const batch = fsMod.writeBatch(db);
            idsToDelete.forEach(id => {
              batch.delete(fsMod.doc(db, "incentives", id));
            });
            await batch.commit();
          } catch (err) {
            handleFirestoreError(err, OperationType.DELETE, "incentives");
          }
        }
        await recordAuditLog(
          "Deleted",
          idsToDelete.join(", "),
          `Bulk deleted ${count} incentive record(s): ${idsToDelete.join(", ")}`
        );
        showToast(`${count} records deleted`);
      };

      // Bulk status change
      const handleBulkStatusChange = async (newStatus) => {
        const idsToUpdate = [...selectedIds];
        const updatedRecords = [];
        const changeDescriptions = [];
        const next = incentives.map(item => {
          if (idsToUpdate.includes(item.id)) {
            const oldStatus = item.status;
            const updated = sanitizeIncentivePayload({ ...item, status: newStatus });
            updatedRecords.push(updated);
            changeDescriptions.push(`${item.id} (${oldStatus} → ${newStatus})`);
            return updated;
          }
          return item;
        });
        const count = idsToUpdate.length;
        updateIncentivesAndPersist(next);
        setBulkStatusOpen(false);
        if (currentUser && fbRef.current && updatedRecords.length > 0) {
          const { db, fsMod } = fbRef.current;
          try {
            const batch = fsMod.writeBatch(db);
            updatedRecords.forEach(rec => {
              batch.set(fsMod.doc(db, "incentives", rec.id), rec);
            });
            await batch.commit();
          } catch (err) {
            handleFirestoreError(err, OperationType.UPDATE, "incentives");
          }
        }
        await recordAuditLog(
          "Updated",
          idsToUpdate.join(", "),
          `Changed Status to ${newStatus} for ${ changeDescriptions.join(", ") }`
        );
        showToast(`${count} records updated to ${newStatus}`);
      };

      const handleOpenAddModal = () => {
        let maxNum = 24;
        incentives.forEach(item => {
          const m = item.id && item.id.match(/^IM-(\d+)$/);

            if (num > maxNum) maxNum = num;

        setEditingRecord({

          incentiveCategory: "Investment & tax",
          policyScheme: "",
          status: "Under Assessment",
          priority: "High",
          benefitSummary: "",
          keyEligibility: "",
          source: "",
          owner: "Business / Finance",
          nextAction: "",
          targetDate: "2026-11-30",
          rag: "Amber"

        setModalMode("add");
      };

      const handleOpenEditModal = (record) => {
        setEditingRecord({ ...record });
        setModalMode("edit");

      const handleSaveRecord = async (e) => {
        e.preventDefault();
        if (!editingRecord.id.trim()) {
          showToast("Record ID is required");
          return;
        }

        const cleanRecord = sanitizeIncentivePayload(editingRecord);

        if (modalMode === "add") {
          if (incentives.some(d => d.id.trim().toUpperCase() === cleanRecord.id.trim().toUpperCase())) {
            showToast(`Record with ID ${cleanRecord.id} already exists.`);
            return;
          }
          const next = [cleanRecord, ...incentives];
          updateIncentivesAndPersist(next);
          if (currentUser && fbRef.current) {
            const { db, fsMod } = fbRef.current;
            try {
              await fsMod.setDoc(fsMod.doc(db, "incentives", cleanRecord.id), cleanRecord);
            } catch (err) {
              handleFirestoreError(err, OperationType.CREATE, `incentives/${cleanRecord.id}`);
            }
          }
          await recordAuditLog(
            "Added",
            cleanRecord.id,
            `Added new incentive '${cleanRecord.policyScheme || cleanRecord.incentiveType}' (${cleanRecord.state} — ${cleanRecord.company}, Status: ${cleanRecord.status})`
          );
          showToast(`Incentive ${cleanRecord.id} added`);
        } else {
          const existingRec = incentives.find(item => item.id === cleanRecord.id);
          const diffSummary = computeUpdateSummary(existingRec, cleanRecord);
          const next = incentives.map(item => item.id === cleanRecord.id ? cleanRecord : item);
          updateIncentivesAndPersist(next);
          if (currentUser && fbRef.current) {
            const { db, fsMod } = fbRef.current;
            try {
              await fsMod.setDoc(fsMod.doc(db, "incentives", cleanRecord.id), cleanRecord);
            } catch (err) {
              handleFirestoreError(err, OperationType.UPDATE, `incentives/${cleanRecord.id}`);
            }
          }
          await recordAuditLog("Updated", cleanRecord.id, diffSummary);
          showToast(`${cleanRecord.id} updated`);
        }
        setModalMode(null);
        setEditingRecord(null);
      };

      const handleExportCsv = () => {
        if (!filteredIncentives.length) {
          showToast("No records to export with current filters.");
          return;
        }
        const headers = [
          "ID", "Government Level", "State", "Location", "Company",
          "Business Segment", "Incentive Type", "Incentive Category",
          "Policy / Scheme", "Status", "Priority", "Benefit Summary",
          "Key Eligibility", "Source", "Owner", "Next Action",
          "Target Date", "RAG"
        ];

        const escapeCsv = (val) => {
          if (val === undefined || val === null) return "";
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };

        const rows = filteredIncentives.map(item => [
          escapeCsv(item.id),
          escapeCsv(item.governmentLevel),
          escapeCsv(item.state),
          escapeCsv(item.location),
          escapeCsv(item.company),
          escapeCsv(item.businessSegment),
          escapeCsv(item.incentiveType),
          escapeCsv(item.incentiveCategory),
          escapeCsv(item.policyScheme),
          escapeCsv(item.status),
          escapeCsv(item.priority),
          escapeCsv(item.benefitSummary),
          escapeCsv(item.keyEligibility),
          escapeCsv(item.source),
          escapeCsv(item.owner),
          escapeCsv(item.nextAction),
          escapeCsv(item.targetDate),
          escapeCsv(item.rag)
        ].join(","));

        const csvContent = [headers.join(","), ...rows].join("\r\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const dateStr = new Date().toISOString().slice(0, 10);
        link.setAttribute("href", url);
        link.setAttribute("download", `incentives_${dateStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast(`Exported ${filteredIncentives.length} records to CSV`);
      };

      // Charts data
      const stateChartData = useMemo(() => {
        const stateMap = {};
        filteredIncentives.forEach(item => {
          const s = item.state || "Unspecified";
          if (!stateMap[s]) {
            stateMap[s] = {
              state: s,
              "Applicable": 0,
              "Application Required": 0,
              "Under Assessment": 0,
              "Claimed": 0,
              "Approved": 0,
              total: 0
            };
          }
          if (stateMap[s][item.status] !== undefined) {
            stateMap[s][item.status]++;
          }
          stateMap[s].total++;
        });

        const order = ["Karnataka", "Haryana", "Gujarat", "Maharashtra"];
        const result = [];
        order.forEach(st => {
          if (stateMap[st]) {
            result.push(stateMap[st]);
            delete stateMap[st];
          } else if (stateFilter === "All" || stateFilter === st) {
            result.push({
              state: st,
              "Applicable": 0,
              "Application Required": 0,
              "Under Assessment": 0,
              "Claimed": 0,
              "Approved": 0,
              total: 0
            });
          }
        });
        Object.values(stateMap).forEach(v => result.push(v));
        return result;
      }, [filteredIncentives, stateFilter]);

      const companyChartData = useMemo(() => {
        const companyMap = {};
        COMPANIES.forEach(comp => {
          companyMap[comp] = {
            company: comp,
            "Applicable": 0,
            "Application Required": 0,
            "Under Assessment": 0,
            "Claimed": 0,
            "Approved": 0,
            total: 0
          };
        });

        filteredIncentives.forEach(item => {
          const c = item.company || "Other";
          if (!companyMap[c]) {
            companyMap[c] = {
              company: c,
              "Applicable": 0,
              "Application Required": 0,
              "Under Assessment": 0,
              "Claimed": 0,
              "Approved": 0,
              total: 0
            };
          }
          if (companyMap[c][item.status] !== undefined) {
            companyMap[c][item.status]++;
          }
          companyMap[c].total++;
        });

        return Object.values(companyMap)
          .filter(c => companyFilter === "All" || c.company === companyFilter || c.total > 0)
          .sort((a, b) => b.total - a.total);

      const categoryChartData = useMemo(() => {

        filteredIncentives.forEach(item => {
          const cat = item.incentiveCategory || "Other";
          catMap[cat] = (catMap[cat] || 0) + 1;
        });

        return Object.entries(catMap).map(([name, value]) => ({
          name,
          value,
          color: CATEGORY_COLORS[name] || "#64748B"
        })).sort((a, b) => b.value - a.value);
      }, [filteredIncentives]);

      const segmentChartData = useMemo(() => {

        BUSINESS_SEGMENTS.forEach(seg => {
          segMap[seg] = 0;

        filteredIncentives.forEach(item => {
          const seg = item.businessSegment || "Other";
          segMap[seg] = (segMap[seg] || 0) + 1;
        });

        return Object.entries(segMap)
          .map(([segment, count]) => ({ segment, count }))
          .filter(s => segmentFilter === "All" || s.segment === segmentFilter || s.count > 0)
          .sort((a, b) => b.count - a.count);
      }, [filteredIncentives, segmentFilter]);

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // ANALYSIS MATRICES DATA PREPARATION

      // Matrix 1: State-wise summary (Rows=State, Cols=Status)

        const rows = stateRows.map(state => {

          statuses.forEach(st => {

            counts[st] = count;
            total += count;
          });
          return { name: state, counts, total };
        });

        const colTotals = {};
        let grandTotal = 0;
        statuses.forEach(st => {
          const sum = rows.reduce((acc, r) => acc + r.counts[st], 0);
          colTotals[st] = sum;
          grandTotal += sum;
        });

        return { rows, colTotals, grandTotal, statuses };
      }, [filteredIncentives]);

      const matrixCompanySummary = useMemo(() => {
        const companyRows = ["TTIPL", "TTSS", "TTRI", "TBIS", "Other TTC Group Companies"];
        const statuses = ["Applicable", "Application Required", "Under Assessment"];

        const rows = companyRows.map(company => {

          statuses.forEach(st => {
            const count = filteredIncentives.filter(i => i.company === company && i.status === st).length;
            counts[st] = count;
            total += count;
          });
          return { name: company, counts, total };

        let grandTotal = 0;
        statuses.forEach(st => {

          colTotals[st] = sum;
          grandTotal += sum;
        });

        return { rows, colTotals, grandTotal, statuses };

      const matrixSegmentSummary = useMemo(() => {

        const categories = ["Employment", "Investment & tax", "Land, finance & power", "Logistics", "Tax / Duty", "Technology & sustainability"];

        categories.forEach(cat => {

                        Owner <span className="text-red-500">*</span>
                      </label>
                      <select
                        value={editingRecord.owner}
                        onChange={(e) => setEditingRecord({ ...editingRecord, owner: e.target.value })}
                        className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                      >
                        {OWNERS.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                        Target Date <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={editingRecord.targetDate}
                        onChange={(e) => setEditingRecord({ ...editingRecord, targetDate: e.target.value })}
                        className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                        Policy / Scheme <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={editingRecord.policyScheme}
                        onChange={(e) => setEditingRecord({ ...editingRecord, policyScheme: e.target.value })}
                        className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                        placeholder="e.g. Karnataka Industrial Policy 2025-30"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                      Benefit Summary
                    </label>
                    <textarea
                      rows={3}
                      value={editingRecord.benefitSummary}
                      onChange={(e) => setEditingRecord({ ...editingRecord, benefitSummary: e.target.value })}
                      className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                      placeholder="Summary of financial or operational incentives provided by the scheme..."
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                      Key Eligibility
                    </label>
                    <textarea
                      rows={2}
                      value={editingRecord.keyEligibility}
                      onChange={(e) => setEditingRecord({ ...editingRecord, keyEligibility: e.target.value })}
                      className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                      placeholder="Minimum capex, area, employment or unit size conditions..."
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                        Source
                      </label>
                      <input
                        type="text"
                        value={editingRecord.source}
                        onChange={(e) => setEditingRecord({ ...editingRecord, source: e.target.value })}
                        className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                        placeholder="Government guidelines, notification ref..."
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-gray-700 mb-1">
                        Next Action
                      </label>
                      <input
                        type="text"
                        value={editingRecord.nextAction}
                        onChange={(e) => setEditingRecord({ ...editingRecord, nextAction: e.target.value })}
                        className="w-full text-xs border border-gray-300 rounded px-3 py-2 text-gray-800 focus:outline-none focus:ring-1 focus:ring-[#1F3864]"
                        placeholder="e.g. Complete eligibility assessment..."
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-gray-200 mt-4">
                    <button
                      type="button"
                      onClick={() => { setModalMode(null); setEditingRecord(null); }}
                      className="px-4 py-2 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-semibold text-white bg-[#1F3864] hover:bg-[#2A4A7C] rounded shadow transition cursor-pointer"
                    >
                      Save Incentive
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* DELETE CONFIRMATION */}
          {deleteTargetId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-lg shadow-xl max-w-sm w-full p-5 animate-modal border border-gray-200">
                <div className="flex items-center gap-3 text-red-600 mb-3">
                  <div className="p-2 bg-red-100 rounded-full">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                  </div>
                  <div>
                    <h3 className="font-bold text-gray-900 text-sm">Delete Incentive?</h3>
                    <p className="text-xs text-gray-500">Delete <strong className="text-gray-800">{deleteTargetId}</strong>? This cannot be undone.</p>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 mt-5">
                  <button
                    onClick={() => setDeleteTargetId(null)}
                    className="px-3.5 py-1.5 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleDeleteSingle(deleteTargetId)}
                    className="px-4 py-1.5 text-xs font-semibold text-white bg-[#EF4444] hover:bg-red-700 rounded shadow transition cursor-pointer"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BULK DELETE CONFIRMATION */}
          {showBulkDeleteConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-lg shadow-xl max-w-sm w-full p-5 animate-modal border border-gray-200">
                <div className="flex items-center gap-3 text-red-600 mb-3">
                  <div className="p-2 bg-red-100 rounded-full">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                  </div>
                  <div>
                    <h3 className="font-bold text-gray-900 text-sm">Delete Selected Records?</h3>
                    <p className="text-xs text-gray-500">Delete <strong className="text-gray-900">{selectedIds.length}</strong> records? This cannot be undone.</p>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 mt-5">
                  <button
                    onClick={() => setShowBulkDeleteConfirm(false)}
                    className="px-3.5 py-1.5 text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleBulkDelete}
                    className="px-4 py-1.5 text-xs font-semibold text-white bg-[#EF4444] hover:bg-red-700 rounded shadow transition cursor-pointer"
                  >
                    Delete Selected
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CHANGE PASSWORD MODAL */}
          {showChangePwdModal && renderChangePasswordModal()}

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#1F3864] text-white px-4 py-3 rounded-lg shadow-xl text-xs font-medium flex items-center gap-2 border border-blue-400/30 animate-toast">
              <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
